<!doctype html><html><head><meta charset="utf-8"><title>icons sheet</title>
<style>body{margin:0;background:#0c100a;display:flex;flex-wrap:wrap;gap:8px;padding:8px}div{width:240px;height:120px;background:#1a2418;position:relative}img{width:240px;height:120px}span{position:absolute;left:4px;top:2px;color:#9ab88c;font:11px monospace}</style></head><body>
<script>for(const m of ['rifle','smg','sniper','mosin','shotgun','m9','m1911','grenade','claymore','decoy','locator']){document.body.insertAdjacentHTML('beforeend',`<div><img src="/icons/${m}.png?${Date.now()}"><span>${m}</span></div>`)}</script>
</body></html>
