<!doctype html>
<meta charset="utf-8" />
<title>ぶら下がりの試写</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 14px/1.5 monospace; }
  canvas { display: block; }
  #readout { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.6); padding: 8px 12px; white-space: pre; }
  #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; background: rgba(0,0,0,.6); padding: 8px 12px; }
  #bar input[type=range] { flex: 1; }
  #bar button { font: inherit; padding: 2px 12px; }
</style>
<div id="readout">…</div>
<div id="bar">
  <button id="play">▶ 再生</button>
  <input id="seek" type="range" min="0" max="3" step="0.01" value="0" />
  <span id="time">0.00 s</span>
</div>
<script type="module" src="./hang.tsx"></script>
